<script>
// Tags de marketing (GTM, Leadster, OpenAI Ads) + eventos de conversao.
(function () {
  // Nao carrega tags de marketing em navegadores automatizados (Lighthouse/bots):
  // mantem a auditoria limpa e evita poluir dados de conversao com trafego nao humano.
  if (navigator.webdriver || /Chrome-Lighthouse|HeadlessChrome|Lightrider/i.test(navigator.userAgent)) return;

  // Stub do pixel OpenAI Ads: enfileira eventos sem custo de rede, para que um
  // clique ocorrido antes do SDK carregar nao seja perdido.
  (function (w) {
    if (w.oaiq) return;
    var q = function () { q.q.push(arguments) };
    q.q = [];
    w.oaiq = q;
  })(window);
  oaiq('init', { pixelId: 'Na1vuxAvMs1hSiJ11vWSoL', debug: location.hostname === 'localhost' });

  var loaded = false;
  function loadThirdParty() {
    if (loaded) return;
    loaded = true;

    // OpenAI Ads (consome a fila acumulada no stub)
    var o = document.createElement('script');
    o.async = true;
    o.src = 'https://bzrcdn.openai.com/sdk/oaiq.min.js';
    document.head.appendChild(o);

    // Google Tag Manager
    (function (w, d, s, l, i) {
      w[l] = w[l] || [];
      w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
      var f = d.getElementsByTagName(s)[0],
        j = d.createElement(s),
        dl = l != 'dataLayer' ? '&l=' + l : '';
      j.async = true;
      j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
      f.parentNode.insertBefore(j, f);
    })(window, document, 'script', 'dataLayer', 'GTM-NVLGQCR');

    // Leadster
    (function (a, b, c, d) {
      try {
        var e = b.head || b.getElementsByTagName('head')[0];
        var f = b.createElement('script');
        f.setAttribute('src', c);
        f.setAttribute('charset', 'UTF-8');
        f.defer = true;
        a.neuroleadId = d;
        e.appendChild(f);
      } catch (g) {}
    })(window, document, 'https://cdn.leadster.com.br/neurolead/neurolead.min.js', 'uZJPeY5WloketnpEVfOGrm75q');
  }

  // Conversoes registradas no painel do OpenAI Ads:
  //   'whatsapp' -> evento custom (ir para o WhatsApp: link direto ou envio do formulario)
  //   'lead'     -> evento padrao lead_created (ida para a pagina de captura do Leadster)
  // track() tambem dispara o carregamento do SDK, cobrindo o caso em que o
  // clique na CTA e a primeira interacao do visitante na pagina.
  // Dedupe por sessao e por tipo: o mesmo visitante repetindo a mesma acao
  // conta uma vez, mas as duas conversoes distintas seguem sendo contadas.
  function track(evento) {
    loadThirdParty();
    try {
      var chave = 'oaiq_' + evento;
      if (sessionStorage.getItem(chave)) return;
      sessionStorage.setItem(chave, '1');
    } catch (e) {}
    try {
      if (evento === 'whatsapp') {
        oaiq('measure', 'custom', { type: 'custom' }, { custom_event_name: 'whatsapp' });
      } else {
        oaiq('measure', 'lead_created', { type: 'customer_action' });
      }
    } catch (e) {}
  }
  window.__track = track;

  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!el) return;
    var href = el.getAttribute('href') || '';
    if (href.indexOf('wa.me') > -1) track('whatsapp');
    else if (href.indexOf('app.leadster.com.br') > -1) track('lead');
  }, true);

  var events = ['scroll', 'mousemove', 'touchstart', 'keydown', 'click'];
  events.forEach(function (ev) {
    window.addEventListener(ev, loadThirdParty, { once: true, passive: true });
  });
  setTimeout(loadThirdParty, 15000);
})();
</script>
